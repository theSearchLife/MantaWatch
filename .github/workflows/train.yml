name: Train & Release Model

on:
  workflow_dispatch:
    # inputs:
    #   epochs:
    #     description: "Override epochs (leave empty to use training_config.yml)"
    #     required: false

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read training config
        id: config
        run: |
          pip install pyyaml -q
          python3 - <<'EOF'
          import yaml, os
          cfg = yaml.safe_load(open("training_config.yml"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"epochs={cfg['epochs']}\n")
              f.write(f"base_model={cfg['base_model']}\n")
              f.write(f"imgsz={cfg['imgsz']}\n")
              f.write(f"batch={cfg['batch']}\n")
              f.write(f"patience={cfg['patience']}\n")
          EOF

      - name: Submit and wait for training job
        timeout-minutes: 360
        run: |
          RELEASE_TAG=$(date +%Y-%m-%d)
          ENDPOINT="https://api.runpod.ai/v2/${{ secrets.RUNPOD_ENDPOINT_ID }}"

          # Submit job
          RESPONSE=$(curl -s -X POST "$ENDPOINT/run" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.RUNPOD_API_KEY }}" \
            -d "{
              \"input\": {
                \"dataset_url\":  \"${{ vars.DATASET_URL }}\",
                \"epochs\":       ${{ steps.config.outputs.epochs }},
                \"base_model\":   \"${{ steps.config.outputs.base_model }}\",
                \"imgsz\":        ${{ steps.config.outputs.imgsz }},
                \"batch\":        ${{ steps.config.outputs.batch }},
                \"patience\":     ${{ steps.config.outputs.patience }},
                \"release_tag\":  \"$RELEASE_TAG\",
                \"github_token\": \"${{ secrets.RELEASE_GITHUB_TOKEN }}\",
                \"repo\":         \"${{ github.repository }}\"
              }
            }")

          JOB_ID=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          if 'id' not in d:
              print(f'ERROR: job not accepted — {d}', file=sys.stderr)
              sys.exit(1)
          print(d['id'])
          ")
          echo "Job submitted — ID: $JOB_ID"

          # Poll until terminal state
          while true; do
            POLL=$(curl -s "$ENDPOINT/status/$JOB_ID" \
              -H "Authorization: Bearer ${{ secrets.RUNPOD_API_KEY }}")

            STATUS=$(echo "$POLL" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','UNKNOWN'))")

            case "$STATUS" in
              IN_QUEUE)
                echo "⏳ In queue..."
                ;;
              IN_PROGRESS|RUNNING)
                echo "🔄 Training in progress..."
                ;;
              COMPLETED)
                echo "✅ Training completed successfully."
                echo "$POLL" | python3 -c "
          import json, sys
          out = json.load(sys.stdin).get('output', {})
          print(f'  Model size : {out.get(\"model_size_mb\", \"—\")} MB')
          print(f'  Release    : {out.get(\"release_url\", \"—\")}')
          "
                break
                ;;
              FAILED)
                echo "❌ Training failed."
                echo "$POLL" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(d.get('error') or d.get('output') or d)
          "
                exit 1
                ;;
              TIMED_OUT)
                echo "⏱️ Job timed out on RunPod (increase Execution Timeout in endpoint settings)."
                exit 1
                ;;
              CANCELLED)
                echo "🚫 Job was cancelled."
                exit 1
                ;;
              *)
                echo "Unknown status: $STATUS — continuing to poll..."
                ;;
            esac

            sleep 60
          done
