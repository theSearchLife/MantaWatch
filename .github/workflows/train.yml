name: Train & Release Model

on:
  workflow_dispatch:
    # inputs:
    #   epochs:
    #     description: "Override epochs (leave empty to use training_config.yml)"
    #     required: false

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read training config
        id: config
        run: |
          pip install pyyaml -q
          python3 - <<'EOF'
          import yaml, os
          cfg = yaml.safe_load(open("training_config.yml"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"epochs={cfg['epochs']}\n")
              f.write(f"base_model={cfg['base_model']}\n")
              f.write(f"imgsz={cfg['imgsz']}\n")
              f.write(f"batch={cfg['batch']}\n")
              f.write(f"patience={cfg['patience']}\n")
          EOF

      - name: Submit and stream training job
        timeout-minutes: 360
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          DATASET_URL: ${{ vars.DATASET_URL }}
          REPO: ${{ github.repository }}
          EPOCHS: ${{ steps.config.outputs.epochs }}
          BASE_MODEL: ${{ steps.config.outputs.base_model }}
          IMGSZ: ${{ steps.config.outputs.imgsz }}
          BATCH: ${{ steps.config.outputs.batch }}
          PATIENCE: ${{ steps.config.outputs.patience }}
        run: |
          RELEASE_TAG=$(date +%Y-%m-%d)

          # Submit job
          RESPONSE=$(curl -s -X POST "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/run" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -d "{
              \"input\": {
                \"dataset_url\":  \"${DATASET_URL}\",
                \"epochs\":       ${EPOCHS},
                \"base_model\":   \"${BASE_MODEL}\",
                \"imgsz\":        ${IMGSZ},
                \"batch\":        ${BATCH},
                \"patience\":     ${PATIENCE},
                \"release_tag\":  \"${RELEASE_TAG}\",
                \"github_token\": \"${RELEASE_GITHUB_TOKEN}\",
                \"repo\":         \"${REPO}\"
              }
            }")

          export JOB_ID=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          if 'id' not in d:
              print(f'ERROR: job not accepted — {d}', file=sys.stderr)
              sys.exit(1)
          print(d['id'])
          ")
          echo "Job submitted — ID: $JOB_ID"

          # Stream epoch-level progress via /stream endpoint
          python3 -u .github/scripts/stream_poll.py
